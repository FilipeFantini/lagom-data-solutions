[project]
name = "lagom-usgs"
version = "0.1.0"
description = "USGS earthquake ingestion into bronze with dlt"
requires-python = ">=3.13,<3.14"
dependencies = ["dlt[postgres]>=1.0", "pyyaml>=6"]

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-pyyaml>=6",
    "dlt[duckdb]>=1.0",
    "requests-mock>=1.12",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["ingestion", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["ingestion"]

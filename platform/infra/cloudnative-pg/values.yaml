# Helm values for the CloudNativePG operator.
# Chart: cnpg/cloudnative-pg 0.29.1 (operator 1.30.1), from
# https://cloudnative-pg.github.io/charts. Only non-defaults are set here.
# See ADR-0012.

# Sized from measurement on 2026-10-16: 24 MiB with no Cluster, 31 MiB
# reconciling one. The limit leaves room for reconcile spikes and for the
# staging Cluster still to come (architecture.md §11).
resources:
  requests: {cpu: 20m, memory: 64Mi}
  limits: {memory: 192Mi}

# The operator is a resident Go process: collect hard before the limit
# instead of letting the heap grow to twice its live size (ADR-0011).
additionalEnv:
  - name: GOMEMLIMIT
    value: 150MiB

# Helm values for Dagster in staging (ADR-0026).
# Chart: dagster/dagster 1.13.27, from https://dagster-io.github.io/helm.
# Only what differs from the chart defaults is set here.
#
# Memory figures are starting values from ADR-0011's spike (webserver ~130,
# daemon ~200, code server ~215 MiB), corrected from `kubectl top` once it runs.

# The metadata lives in the database `dagster` of staging's Postgres, as the
# role `dagster` (postgres-staging/cluster.yaml). Its password is in the
# sealed Secret dagster-db, under the key the chart reads.
global:
  postgresqlSecretName: dagster-db
generatePostgresqlPasswordSecret: false
postgresql:
  enabled: false
  postgresqlHost: postgres-rw
  postgresqlUsername: dagster
  postgresqlDatabase: dagster
  # Pod to Service: TLS required, as every in-cluster client here.
  postgresqlParams:
    sslmode: require
  # psycopg2, the driver dagster-postgres declares and Dagster's SQL is written
  # for. SQLAlchemy 2.1 would pick psycopg 3, whose server-side parameters
  # ("\$1") Dagster's statements reject: the first staging run failed with
  # `syntax error at or near "$1"` (2026-10-28).
  postgresqlScheme: postgresql+psycopg2
  service:
    port: 5432

telemetry:
  enabled: false

dagsterWebserver:
  resources:
    requests: {cpu: 25m, memory: 192Mi}
    limits: {memory: 384Mi}
  # The init container only waits for Postgres.
  initContainerResources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {memory: 32Mi}

dagsterDaemon:
  resources:
    requests: {cpu: 25m, memory: 256Mi}
    limits: {memory: 512Mi}
  initContainerResources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {memory: 32Mi}
  runCoordinator:
    enabled: true
    type: QueuedRunCoordinator
    config:
      queuedRunCoordinator:
        # Two runs of the pipeline never overlap: both would read dlt's cursor
        # and write it back (the CronJob's concurrencyPolicy: Forbid).
        tagConcurrencyLimits:
          - key: lagom/pipeline
            value: usgs
            limit: 1

runLauncher:
  type: K8sRunLauncher
  config:
    k8sRunLauncher:
      # The image is pinned by digest, so a cached copy is the right copy.
      imagePullPolicy: IfNotPresent
      runK8sConfig:
        # The code location's container securityContext does not reach runs:
        # the chart passes only the Pod-level one. It is set here for every
        # run's container (found in review of PR #32).
        containerConfig:
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
        jobSpecConfig:
          # No retry from Kubernetes: Dagster decides, and a failed run waits
          # for the next schedule. A finished Job and its Pod go after an hour,
          # and a hung run is stopped after 25 minutes, before the next slot.
          backoffLimit: 0
          ttlSecondsAfterFinished: 3600
          activeDeadlineSeconds: 1500

dagster-user-deployments:
  enabled: true
  enableSubchart: true
  imagePullSecrets:
    - name: ghcr-pull
  deployments:
    - name: lagom
      image:
        repository: ghcr.io/filipefantini/lagom-orchestration
        # Pinned by digest (ADR-0015): built from main at ccdf9a3 (PR #34,
        # psycopg 3 for Dagster's Postgres storage).
        tag: "ccdf9a30d6fafad3956e3db9065829104b95a410@sha256:d4bd17c127f524bfafccea69c6de1144ad125aa098c1824c89061bd1a50869da"
        pullPolicy: IfNotPresent
      dagsterApiGrpcArgs: ["-m", "lagom_orchestration.definitions"]
      port: 3030
      # Runs inherit this deployment's image, environment, resources, volumes
      # and Pod security context, in this namespace. The container security
      # context is set for runs in runLauncher above.
      includeConfigInLaunchedRuns:
        enabled: true
      # The code server idles at ~215 MiB; a run with dlt and dbt peaks at
      # ~250-300 MiB. One figure serves both, since runs inherit it. The
      # run's request is also written on the Application
      # (apps/dagster-staging.yaml, lagom.dev/ephemeral-memory-request) for
      # the budget check: change both together.
      resources:
        requests: {cpu: 50m, memory: 384Mi}
        limits: {memory: 1Gi}
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
      # Every writer goes to /tmp: dlt, dbt, DuckDB's extensions and spill.
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      # Kubernetes expands $(NAME) from variables defined above it in the list.
      env:
        # The DuckLake catalog: staging's `lagom` database, as its owner, from
        # the Secret CloudNativePG generates. TLS required.
        - name: PG_URI
          valueFrom: {secretKeyRef: {name: postgres-app, key: uri}}
        - name: PGSSLMODE
          value: require
        # The R2 token for lagom-staging-lake, sealed in r2-lake-sealed.yaml.
        - name: LAGOM_R2_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: r2-lake, key: ACCESS_KEY_ID}}
        - name: LAGOM_R2_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: r2-lake, key: ACCESS_SECRET_KEY}}
        - name: LAGOM_R2_ENDPOINT
          valueFrom: {secretKeyRef: {name: r2-lake, key: ENDPOINT}}
        # dlt's DuckLake destination.
        - name: DESTINATION__DUCKLAKE__CREDENTIALS__CATALOG
          value: "$(PG_URI)"
        - name: DESTINATION__DUCKLAKE__CREDENTIALS__DUCKLAKE_NAME
          value: lagom
        - name: DESTINATION__DUCKLAKE__CREDENTIALS__METADATA_SCHEMA
          value: ducklake
        - name: DESTINATION__DUCKLAKE__CREDENTIALS__STORAGE__BUCKET_URL
          value: s3://lagom-staging-lake
        - name: DESTINATION__DUCKLAKE__CREDENTIALS__STORAGE__CREDENTIALS__AWS_ACCESS_KEY_ID
          value: "$(LAGOM_R2_ACCESS_KEY_ID)"
        - name: DESTINATION__DUCKLAKE__CREDENTIALS__STORAGE__CREDENTIALS__AWS_SECRET_ACCESS_KEY
          value: "$(LAGOM_R2_SECRET_ACCESS_KEY)"
        - name: DESTINATION__DUCKLAKE__CREDENTIALS__STORAGE__CREDENTIALS__ENDPOINT_URL
          value: "$(LAGOM_R2_ENDPOINT)"
        - name: DESTINATION__DUCKLAKE__CREDENTIALS__STORAGE__CREDENTIALS__REGION_NAME
          value: auto
        # The same lake for dbt's `lake` target and the maintenance job.
        - name: LAGOM_LAKE_CATALOG
          value: "ducklake:postgres:$(PG_URI)?sslmode=require"
        - name: LAGOM_LAKE_DATA_PATH
          value: s3://lagom-staging-lake/
        - name: LAGOM_LAKE_METADATA_SCHEMA
          value: ducklake

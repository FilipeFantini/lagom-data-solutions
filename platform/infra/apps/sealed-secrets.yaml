# Sealed Secrets: encrypts Secrets so they can live in Git. Only this
# controller holds the private key that decrypts them. See ADR-0010.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://bitnami.github.io/sealed-secrets
      chart: sealed-secrets
      targetRevision: 2.20.0
      helm:
        releaseName: sealed-secrets
        valueFiles:
          - $values/platform/infra/sealed-secrets/values.yaml
    - repoURL: https://github.com/FilipeFantini/lagom-data-solutions.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      # Never prune: deleting the controller's objects by mistake must not be
      # one merge away. The sealing key itself is not part of the chart.
      prune: false
      selfHeal: true

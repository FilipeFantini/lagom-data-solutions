# A trivial nginx that proves the loop: change platform/infra/hello/ in a
# commit, merge, and the cluster converges with no command run by hand.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/FilipeFantini/lagom-data-solutions.git
    targetRevision: main
    path: platform/infra/hello
  destination:
    server: https://kubernetes.default.svc
    namespace: hello
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

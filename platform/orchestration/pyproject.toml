[project]
name = "lagom-orchestration"
version = "0.1.0"
description = "Dagster code location: every service's assets and the dbt project (ADR-0026)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dagster==1.13.27",
    "dagster-k8s==0.29.27",
    "dagster-postgres==0.29.27",
    "dagster-dbt==0.29.27",
    "dlt[ducklake,s3,postgres]==1.31.0",
    "dbt-core==1.12.6",
    "dbt-duckdb==1.11.1",
    # 2.0 removes an API dlt 1.31 uses (Relation.fetchone); found 2026-10-28.
    "duckdb>=1.5.5,<2",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.6", "types-pyyaml>=6", "requests-mock>=1.12"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root, so `services.usgs.assets` imports as it does in the image.
pythonpath = [".", "../.."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
ignore_missing_imports = true
